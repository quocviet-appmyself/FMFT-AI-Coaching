<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMFT AI Coaching - Dynamic Living OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-main: #1A1A1A;
            --text-muted: #737373;
            --border-color: #E5E5E5;
            --accent-gold: #D4AF37;
            --accent-dark: #111111;
            --success-color: #10B981;
            --danger-color: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100vw;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 480px) {
            .mobile-container {
                border-radius: 40px;
                border: 8px solid #222;
                box-shadow: 0 25px 50px rgba(0,0,0,0.4);
                height: 844px;
            }
        }

        header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-dark);
        }

        .logo span {
            color: var(--accent-gold);
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tab-content::-webkit-scrollbar {
            display: none;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 14px;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .daily-greeting {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .time-block {
            margin-bottom: 10px;
            border-left: 2px solid var(--accent-gold);
            padding-left: 8px;
        }

        .time-block-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .todo-item-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 11px;
            color: var(--text-main);
        }

        .todo-item-row input[type="checkbox"] {
            accent-color: var(--accent-dark);
            margin-top: 2px;
        }

        .todo-purpose {
            display: block;
            font-size: 9px;
            color: var(--text-muted);
            font-style: italic;
        }

        .adhoc-box {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .adhoc-box input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 11px;
            outline: none;
        }

        .adhoc-box button {
            background: var(--accent-dark);
            color: #fff;
            border: none;
            padding: 0 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Chat & Strategy */
        .chat-box {
            display: flex;
            flex-direction: column;
            height: 360px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            background: #fff;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 6px;
        }

        .message {
            max-width: 90%;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 11px;
            line-height: 1.4;
        }

        .message.ai {
            background: #F4F4F4;
            color: var(--text-main);
            align-self: flex-start;
        }

        .message.user {
            background: var(--accent-dark);
            color: #fff;
            align-self: flex-end;
        }

        .approve-strategy-btn {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            display: inline-block;
        }

        .chat-input-area {
            display: flex;
            gap: 6px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            font-size: 11px;
        }

        .chat-input-area button {
            background: var(--accent-gold);
            color: #111;
            border: none;
            padding: 0 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 11px;
        }

        /* Modal Settings */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: white;
            width: 85%;
            padding: 20px;
            border-radius: 14px;
        }

        nav.bottom-nav {
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 8px 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 500;
            background: none;
            border: none;
        }

        .nav-item.active {
            color: var(--accent-gold);
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .badge-status {
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent-gold);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.3);
            display: inline-block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Header -->
        <header>
            <div class="logo">FMFT AI <span>OS</span></div>
            <div class="header-actions">
                <button class="icon-btn" onclick="openSettingsModal()">⚙️</button>
            </div>
        </header>

        <!-- TAB 1: PUBLIC TO-DO LIST -->
        <div id="tab-todo" class="tab-content active">
            <div class="daily-greeting" id="dateStringDisplay">Hôm nay: Thứ Tư, 26/08/2026</div>
            
            <div class="card">
                <h3>Checklist Thực Thi (Dynamic Focus)</h3>
                <div id="dynamicTodoList"></div>

                <div class="adhoc-box">
                    <input type="text" id="adhocInput" placeholder="Thêm việc phát sinh nhanh...">
                    <button onclick="addAdhocTask()">Thêm</button>
                </div>
            </div>
        </div>

        <!-- TAB 2: FMFT PRIVATE AI -->
        <div id="tab-strategy" class="tab-content">
            <div class="badge-status">🔒 FMFT Private AI Strategy & Coaching</div>
            
            <div class="card" style="margin-bottom: 0;">
                <h3>Tâm sự & Hoạch định mục tiêu</h3>
                <div class="chat-box">
                    <div class="chat-messages" id="privateChatMessages">
                        <div class="message ai">
                            Chào Việt! Cứ chia sẻ mục tiêu hoặc trăn trở hiện tại của cậu nhé. Tớ sẽ cùng thảo luận và đưa ra chiến lược tối ưu nhất cho cậu duyệt!
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="privateUserInput" placeholder="Nhập tâm sự hoặc mục tiêu mới..." onkeypress="handlePrivateKeyPress(event)">
                        <button onclick="sendPrivateMessage()">Gửi</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SETTINGS MODAL -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal-content">
                <h3 style="margin-bottom: 12px;">Cài đặt hệ thống</h3>
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <label style="font-size:11px; color:var(--text-muted);">Gemini API Key:</label>
                    <input type="password" id="apiKeyInput" placeholder="Dán API Key vào đây..." style="padding:8px; border:1px solid var(--border-color); border-radius:8px; font-size:11px; outline:none;">
                    <button onclick="saveApiKey()" style="background:var(--accent-dark); color:#fff; border:none; padding:8px; border-radius:8px; font-size:11px; font-weight:600; cursor:pointer;">Lưu API Key</button>
                    
                    <hr style="border:0; border-top:1px solid var(--border-color); margin: 6px 0;">
                    
                    <label style="font-size:11px; color:var(--danger-color); font-weight:600;">Vùng nguy hiểm:</label>
                    <button id="resetBtn" onmousedown="startResetTimer()" onmouseup="cancelResetTimer()" ontouchstart="startResetTimer()" ontouchend="cancelResetTimer()" style="background:var(--danger-color); color:#fff; border:none; padding:10px; border-radius:8px; font-size:11px; font-weight:600; cursor:pointer;">Giữ 10 giây để Reset Toàn Bộ Mục Tiêu</button>
                    <div id="resetProgress" style="font-size:10px; color:var(--text-muted); text-align:center;"></div>

                    <button onclick="closeSettingsModal()" style="background:none; border:1px solid var(--border-color); padding:8px; border-radius:8px; font-size:11px; cursor:pointer; margin-top:6px;">Đóng</button>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('todo')" id="nav-todo">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                List-to-do
            </button>
            <button class="nav-item" onclick="switchTab('strategy')" id="nav-strategy">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                Private AI
            </button>
        </nav>
    </div>

    <script>
        const daysOfWeek = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        const todayObj = new Date();
        document.getElementById('dateStringDisplay').innerText = `Hôm nay: ${daysOfWeek[todayObj.getDay()]} (${todayObj.toLocaleDateString('vi-VN')}). Hệ thống tự động cuốn chiếu lộ trình!`;

        let state = JSON.parse(localStorage.getItem('fmft_dynamic_state_v4')) || {
            apiKey: '',
            chatHistory: [],
            todoList: [
                {
                    category: "Trọng tâm hiện tại: Tăng tốc BĐS Đà Nẵng",
                    items: [
                        { text: "Tập trung 80% thời gian tối cho Salephone & mở rộng data khách hàng", purpose: "Chiến lược cốt lõi chốt deal", checked: false },
                        { text: "Cập nhật giỏ hàng & quản lý file CRM BĐS hằng ngày", purpose: "Sẵn sàng nguồn hàng", checked: false }
                    ]
                },
                {
                    category: "Kỷ luật bản thân & Sức khỏe",
                    items: [
                        { text: "Đọc 2 chương Kinh Thánh (Cộng dồn từ hôm qua chưa hoàn thành)", purpose: "Duy trì ôn thi Thần học", checked: false },
                        { text: "Đi ngủ trước 23:00 bảo vệ sức khỏe sinh học", purpose: "Năng lượng bền bỉ", checked: false }
                    ]
                }
            ]
        };

        if (state.apiKey) document.getElementById('apiKeyInput').value = state.apiKey;
        renderTodoList();
        renderChatHistory();

        function saveState() {
            localStorage.setItem('fmft_dynamic_state_v4', JSON.stringify(state));
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
        }

        function openSettingsModal() { document.getElementById('settingsModal').classList.add('active'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.remove('active'); }

        function saveApiKey() {
            const val = document.getElementById('apiKeyInput').value.trim();
            if (val) {
                state.apiKey = val;
                saveState();
                alert('Đã lưu API Key thành công!');
                closeSettingsModal();
            } else {
                alert('Vui lòng nhập API Key hợp lệ.');
            }
        }

        let resetTimer = null;
        let countdown = 10;
        function startResetTimer() {
            countdown = 10;
            document.getElementById('resetProgress').innerText = `Đang giữ... thả ra để hủy (${countdown}s)`;
            resetTimer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    document.getElementById('resetProgress').innerText = `Đang giữ... còn ${countdown} giây`;
                } else {
                    clearInterval(resetTimer);
                    localStorage.removeItem('fmft_dynamic_state_v4');
                    alert('Đã reset toàn bộ hệ thống!');
                    location.reload();
                }
            }, 1000);
        }
        function cancelResetTimer() {
            if (resetTimer) {
                clearInterval(resetTimer);
                document.getElementById('resetProgress').innerText = '';
            }
        }

        function renderTodoList() {
            const container = document.getElementById('dynamicTodoList');
            container.innerHTML = '';
            state.todoList.forEach((block, bIdx) => {
                let html = `<div class="time-block">
                    <div class="time-block-title">${block.category}</div>`;
                block.items.forEach((item, iIdx) => {
                    html += `<div class="todo-item-row">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onclick="toggleCheck(${bIdx}, ${iIdx})">
                        <div><span>${item.text}</span><span class="todo-purpose">${item.purpose}</span></div>
                    </div>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            });
        }

        function toggleCheck(bIdx, iIdx) {
            state.todoList[bIdx].items[iIdx].checked = !state.todoList[bIdx].items[iIdx].checked;
            saveState();
        }

        function addAdhocTask() {
            const input = document.getElementById('adhocInput');
            const text = input.value.trim();
            if (!text) return;
            state.todoList[0].items.unshift({ text: text, purpose: "Việc phát sinh trong ngày", checked: false });
            saveState();
            renderTodoList();
            input.value = '';
        }

        function renderChatHistory() {
            const chatMessages = document.getElementById('privateChatMessages');
            chatMessages.innerHTML = '';
            state.chatHistory.forEach(msg => {
                let contentHtml = escapeHtml(msg.text).replace(/\n/g, '<br>');
                if (msg.hasApproveBtn && !msg.approved) {
                    contentHtml += `<br><button class="approve-strategy-btn" onclick="approveStrategy(${msg.id})">✓ Duyệt chiến lược này & Cập nhật To-do</button>`;
                } else if (msg.approved) {
                    contentHtml += `<br><span style="font-size:10px; color:var(--success-color); font-weight:700;">✓ Đã duyệt và áp dụng vào lộ trình!</span>`;
                }
                chatMessages.innerHTML += `<div class="message ${msg.role}">${contentHtml}</div>`;
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handlePrivateKeyPress(e) {
            if (e.key === 'Enter') sendPrivateMessage();
        }

        async function sendPrivateMessage() {
            const input = document.getElementById('privateUserInput');
            const text = input.value.trim();
            if (!text) return;

            state.chatHistory.push({ role: 'user', text: text, id: Date.now() });
            input.value = '';
            renderChatHistory();

            if (!state.apiKey) {
                state.chatHistory.push({ role: 'ai', text: "Cậu ơi, hãy vào Cài đặt (⚙️) nhập API Key để kích hoạt AI nhé!", id: Date.now() });
                renderChatHistory();
                return;
            }

            const loadingId = Date.now();
            state.chatHistory.push({ role: 'ai', text: "FMFT AI đang tổng hợp chiến lược...", id: loadingId });
            renderChatHistory();

            const systemInstruction = "Bạn là FMFT AI Coaching - hệ thống cố vấn chiến lược và đồng hành cá nhân thông minh, tâm lý, sáng tạo, vui tính. Người dùng tên Việt. Khi người dùng trình bày mục tiêu, hãy phân tích và đưa ra đề xuất chiến lược ngắn gọn, rõ ràng kèm theo các hành động cụ thể để người dùng kiểm duyệt.";

            // Sử dụng chuẩn model gemini-2.5-flash chính thức
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`;

            let aiReply = null;
            let lastErrorMsg = '';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: systemInstruction + "\n\nYêu cầu từ người dùng: " + text }] }
                        ]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    aiReply = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    lastErrorMsg = data.error.message;
                }
            } catch (err) {
                lastErrorMsg = err.message;
            }

            state.chatHistory = state.chatHistory.filter(m => m.id !== loadingId);

            if (aiReply) {
                state.chatHistory.push({ 
                    role: 'ai', 
                    text: aiReply, 
                    id: Date.now(), 
                    hasApproveBtn: true, 
                    approved: false,
                    newPlanData: [
                        { category: "Chiến lược mới từ Private AI", items: [{ text: text, purpose: "Đã được AI quy hoạch hành động", checked: false }] }
                    ]
                });
            } else {
                state.chatHistory.push({ role: 'ai', text: `Lỗi kết nối AI: ${lastErrorMsg || 'Không nhận được phản hồi'}. Cậu kiểm tra lại API Key nhé!`, id: Date.now() });
            }
            saveState();
            renderChatHistory();
        }

        function approveStrategy(msgId) {
            const msg = state.chatHistory.find(m => m.id === msgId);
            if (msg) {
                msg.approved = true;
                if (msg.newPlanData) {
                    state.todoList.unshift(...msg.newPlanData);
                }
                saveState();
                renderChatHistory();
                renderTodoList();
                alert('Đã duyệt chiến lược! Hệ thống đã tự động cập nhật vào List-to-do.');
                switchTab('todo');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
